[build-system]
requires = [
    "setuptools>=40.8.0",
    "wheel",
    "Cython>=0.29.21,<3.1; python_version < '3.8'",
    "Cython>=3.1.0; python_version >= '3.8'",
]
build-backend = "setuptools.build_meta"

[project]
name = "trpc-python-sdk"
dynamic = ["version"]
description = "A pluggable, high-performance RPC framework written in python"
readme = "README.md"
requires-python = ">=3.6"
authors = [{ name = "tRPC Group" }]
dependencies = [
    # PyYAML 6.x requires Python >= 3.8
    "PyYAML>=5.1.0,<6.0; python_version < '3.8'",
    "PyYAML>=6.0.2; python_version >= '3.8'",
    "aiohttp>=3.6.2",
    "netifaces>=0.10.9",
    "uvloop==0.14.0; python_version < '3.7'",
    "uvloop>=0.15.0; python_version >= '3.7'",
    "portalocker>=1.4.0",
    "automaxprocs>=2.0.0",
    "Cython>=0.29.21,<3.1; python_version < '3.8'",
    "Cython>=3.1.0; python_version >= '3.8'",
    "six>=1.15.0",
    # replace.sh: Python >= 3.12 pin aiocron==2.1
    "aiocron>=1.6; python_version < '3.12'",
    "aiocron>=2.1; python_version >= '3.12'",
    "psutil>=5.9.0",
    "py-spy>=0.3.14",
    "trpc-pb>=0.3.0",
    "python_gflags>=3.1.2",
    "backports.zoneinfo; python_version < '3.9' and sys_platform == 'darwin'",
    "dataclasses>=0.8; python_version < '3.7'",
]

[project.urls]
Documentation = "https://git.woa.com/trpc-python/trpc-python/wikis/home"
Code = "https://git.woa.com/trpc-python/trpc-python"
"Issue tracker" = "https://git.woa.com/trpc-python/trpc-python/issues"

[project.optional-dependencies]
snappy = ["python-snappy>=0.5.4"]
dev = [
    "pytest",
    "pyyaml"
]
fast = [
    "uvloop==0.14.0; python_version < '3.7'",
    "uvloop>=0.15.0; python_version >= '3.7'",
]

[dependency-groups]
test = [
    "pytest-mock",
    "pytest-asyncio",
    "pyparsing==2.2.0",
    "pytest>=6.1.0",
    "pytest-cov",
    "xmlrunner; python_version < '3.12'",
    "unittest-xml-reporting; python_version >= '3.12'",
]

[tool.setuptools]
zip-safe = false
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "trpc.__version__" }

[tool.setuptools.packages.find]
include = ["trpc", "trpc.*"]

[tool.setuptools.package-data]
trpc = ["lib/*.so*"]

[tool.uv]
package = true
default-groups = ["test"]

# 使用腾讯云镜像（与 requirements.txt 一致）
[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "tencent-private"
url = "https://mirrors.tencent.com/repository/pypi/tencent_pypi/simple/"
