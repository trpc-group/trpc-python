global: # global settings
  namespace: Development # environment type: production or development
  env_name: test # environment name used when namespace is not production

server: # server settings
  app: trpc_python_group # application name
  server: helloworld # server process name
  check_timeout: false
  queue_wait_policy: 1
  queue_wait_timeout: 10
  # In merge mode each process listens on the same IP and port via SO_REUSEADDR.
  service: # services exposed by this process; more than one is allowed
    - name: trpc.trpc_python_group.helloworld.Greeter # service route name
      ip: 127.0.0.1 # listen IP; ${ip} is allowed; set either ip or nic, and ip wins
      port: 9002 # listen port; ${port} is allowed
      network: tcp # transport: tcp or udp
      protocol: http # application protocol: trpc or http
      timeout: 5000 # max request processing time, in milliseconds
      #tls_key: ./domain_srv.key
      #tls_cert: ./domain_srv.crt
    - name: trpc.trpc_python_group.helloworld.Normal           # service route name
      ip: 127.0.0.1                                # listen IP; ${ip} is allowed; set either ip or nic, and ip wins
      network: tcp                                 # transport: tcp or udp
      protocol: http                              # application protocol: trpc or http
      timeout: 5000                                # max request processing time, in milliseconds
      port: 9003 # listen port; ${port} is allowed


client: # client backend settings
  timeout: 1000 # max processing time for every backend
  namespace: Development # namespace for every backend
  service: # per-backend settings
    - name: trpc.trpc_python_group.helloworld.Greeter # backend service name
      network: tcp # backend transport, tcp or udp; this config takes priority
      protocol: http # application protocol: trpc or http
      timeout: 800 # max request processing time


plugins: # plugin settings
  log: # log settings
    default: # default logger; multiple outputs are allowed
      - writer: console # stdout; this is the default writer
        level: info # level for this stdout writer
        format_config:
          # timestamps include milliseconds
          fmt: "[%(asctime)s.%(msecs)03d][%(levelname)s][%(filename)s:%(lineno)s][%(process)d][%(message)s]"
          time_fmt: "%Y-%m-%d %H:%M:%S"
      - writer: file # local file log
        level: info # level for the rotating file log
        formatter: json # format of this writer
        writer_config:
          filename: ./hello.log # path of the rotating log file
          max_size: 10 # max size of the rotating log file, in MB
          max_backups: 10 # max number of log files
          max_age: 7 # max age of log files, in days
          compress: false # whether to compress log files
        format_config:
          fmt: "[%(asctime)s][%(levelname)s][%(filename)s:%(lineno)s][%(process)d][%(message)s]"
          time_fmt: "%Y-%m-%d %H:%M:%S"
