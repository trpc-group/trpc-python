# Peer mode: this process is worker-0 and forks handle_num-1 siblings.
# Every worker connects to admin, so /cmds/whoami reports handle_num pids.
global:
  namespace: Development
  env_name: test
  processmodel:
    mode: multi_process
    io_handle_type: merge
    handle_num: 2

server:
  app: test
  server: Greeter
  close_wait_time: 2000
  admin:
    ip: 127.0.0.1
    port: 19421
  service:
    - name: trpc.trpc_python_group.helloworld.Greeter
      ip: 127.0.0.1
      port: 18421
      network: tcp
      protocol: trpc
      timeout: 10000
      disable_request_timeout: true

plugins:
  log:
    default:
      - writer: console
        level: info
