syntax = "proto3";
package trpc.trpc_python_group.hellotrt;
import "tensor.proto";


message TensorData {
  // Map Key: Target name, if there's only 1 target,
  //          key is "default"
  //   value: Tensor
  map<string, TensorProto> data = 1;
}

message LoadModelRequest {
  string model_path = 1;
  int32 engine_type = 2;
  int32 max_batch_size = 3;
  int32 device = 4;
  int32 thread_num = 5;
  int32 trt_opt_batch_size = 6;
  int32 trt_max_batch_size = 7;
  int32 inter_op_num_threads = 8;
  int32 intra_op_num_threads = 9;
  int32 onnxrt_mode = 10;
}
